version: '3.8'

services:
  attendance-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=supabase-db
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=supabase_admin
      - DB_PASSWORD=7567@Hetp
      - DB_SSL=false
      - CORS_ORIGIN=https://supabase.atmyhome.tech
      - VIRTUAL_HOST=api.atmyhome.tech
      - VIRTUAL_PORT=3001
      - METRONOME_INTERVAL_MS=3000
      - METRONOME_TOKEN_LENGTH=6
      - METRONOME_TOKEN_CHARSET=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
      - METRONOME_LOOKAHEAD_TOKENS=2
      - JUDGE_MAX_LATENCY_MS=250
      - JUDGE_TOKEN_VALIDITY_WINDOW_MS=5000
    networks:
      - proxynet
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "nginx-proxy-ondemand.enable=true"
      - "nginx-proxy-ondemand.timeout=1800"
      - "nginx-proxy-ondemand.group=dev-suite"
      - "VIRTUAL_HOST=api.atmyhome.tech"
      - "VIRTUAL_PORT=3001"

networks:
  proxynet:
    external: true
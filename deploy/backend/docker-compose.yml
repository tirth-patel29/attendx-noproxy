# ============================================================================
# attendance-backend — per-stack compose for nginx-proxy deployments
# (homelab layout: this file sits NEXT TO ./src, ./Dockerfile).
# All values are environment-driven; see ../docker-compose.yml for the
# fully portable single-command deployment.
# ============================================================================

version: '3.8'

services:
  attendance-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=${DB_HOST:-supabase-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-supabase_admin}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - DB_SSL=${DB_SSL:-false}
      # Comma-separated allowed CORS origins (Express API + Socket.IO handshake)
      - CORS_ORIGIN=${CORS_ORIGIN:-https://portal.atmyhome.tech,https://admin.atmyhome.tech,https://supabase.atmyhome.tech}
      - VIRTUAL_HOST=${VIRTUAL_HOST:-api.atmyhome.tech}
      - VIRTUAL_PORT=3001
      - METRONOME_INTERVAL_MS=${METRONOME_INTERVAL_MS:-3000}
      - METRONOME_TOKEN_LENGTH=${METRONOME_TOKEN_LENGTH:-4}
      - METRONOME_TOKEN_CHARSET=${METRONOME_TOKEN_CHARSET:-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789}
      - METRONOME_LOOKAHEAD_TOKENS=${METRONOME_LOOKAHEAD_TOKENS:-2}
      - JUDGE_MAX_LATENCY_MS=${JUDGE_MAX_LATENCY_MS:-250}
      - JUDGE_TOKEN_VALIDITY_WINDOW_MS=${JUDGE_TOKEN_VALIDITY_WINDOW_MS:-5000}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production-min-32-chars-long}
      # Reliable admin bootstrap (upsert on every boot)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@atmyhome.tech}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - ADMIN_NAME=${ADMIN_NAME:-System Admin}
    networks:
      - proxynet
    deploy:
      resources:
        limits: { memory: 512M, cpus: '0.5' }
        reservations: { memory: 256M, cpus: '0.25' }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "nginx-proxy-ondemand.enable=true"
      - "nginx-proxy-ondemand.timeout=1800"
      - "nginx-proxy-ondemand.group=dev-suite"
      - "VIRTUAL_HOST=${VIRTUAL_HOST:-api.atmyhome.tech}"
      - "VIRTUAL_PORT=3001"

networks:
  proxynet:
    external: true
server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # API proxy - MUST come before SPA fallback
    location /api {
        proxy_pass http://attendance-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Favicon - serve empty 204 if missing to avoid 404 noise
    location = /favicon.svg {
        access_log off;
        return 204;
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Static assets caching - with proper fallback
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|json|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - ALL other routes go to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
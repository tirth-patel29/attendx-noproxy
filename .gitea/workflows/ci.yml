# ============================================================================
# Gitea Actions — build + typecheck + test + auto-deploy on push to main.
# ============================================================================
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd backend && npm ci
      - run: cd backend && npm run build

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd portal && npm ci
      - run: cd portal && npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd admin && npm install
      - run: cd admin && npm run build

  docker-build:
    needs: [backend, portal, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t attendance-backend:ci ./backend
      - run: docker build -t attendance-portal:ci ./portal
      - run: docker build -t attendance-admin:ci ./admin

  # ---- CD: on every push to main, build the images AND update the running
  # ---- containers on the homelab. Code change -> image -> deploy, automated.
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.SSH_HOST != '' }}
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ssh + rsync
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y openssh-client rsync
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - name: Install deploy key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy to homelab (build + recreate containers)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ~/.ssh/id_deploy
          HOST_STACKS: ${{ secrets.HOST_STACKS }}
        run: ./scripts/deploy-all.sh
      - name: Verify health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ~/.ssh/id_deploy
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$SSH_HOST" \
            'docker ps --filter name=attendance- --format "{{.Names}} {{.Status}}"'

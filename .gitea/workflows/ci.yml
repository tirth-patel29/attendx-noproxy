# ============================================================================
# Gitea Actions — build + typecheck + test + auto-deploy on push to main.
# Uses self-hosted runner with labels: [docker, ubuntu, self-hosted]
# ============================================================================
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, docker]
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout code
        run: |
          cd /root
          if [ -d attendance-gateway/.git ]; then
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
            git fetch --depth=1 origin main
            git reset --hard origin/main
          else
            git clone --depth=1 --branch main http://gitea:3000/het/attendance-gateway.git
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
          fi
      - name: Install Node.js
        run: |
          apk add --no-cache nodejs npm
          node --version
          npm --version
      - name: Install backend dependencies
        run: cd /root/attendance-gateway/backend && npm ci
      - name: Build backend
        run: cd /root/attendance-gateway/backend && npm run build

  portal:
    runs-on: [self-hosted, docker]
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout code
        run: |
          cd /root
          if [ -d attendance-gateway/.git ]; then
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
            git fetch --depth=1 origin main
            git reset --hard origin/main
          else
            git clone --depth=1 --branch main http://gitea:3000/het/attendance-gateway.git
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
          fi
      - name: Install Node.js
        run: |
          apk add --no-cache nodejs npm
          node --version
          npm --version
      - name: Install portal dependencies
        run: cd /root/attendance-gateway/portal && npm ci
      - name: Build portal
        run: cd /root/attendance-gateway/portal && npm run build

  admin:
    runs-on: [self-hosted, docker]
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout code
        run: |
          cd /root
          if [ -d attendance-gateway/.git ]; then
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
            git fetch --depth=1 origin main
            git reset --hard origin/main
          else
            git clone --depth=1 --branch main http://gitea:3000/het/attendance-gateway.git
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
          fi
      - name: Install Node.js
        run: |
          apk add --no-cache nodejs npm
          node --version
          npm --version
      - name: Install admin dependencies
        run: cd /root/attendance-gateway/admin && npm install
      - name: Build admin
        run: cd /root/attendance-gateway/admin && npm run build

  docker-build:
    needs: [backend, portal, admin]
    runs-on: [self-hosted, docker]
    steps:
      - name: Install git and docker
        run: |
          apk add --no-cache git docker-cli
          docker --version
      - name: Checkout code
        run: |
          cd /root
          if [ -d attendance-gateway/.git ]; then
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
            git fetch --depth=1 origin main
            git reset --hard origin/main
          else
            git clone --depth=1 --branch main http://gitea:3000/het/attendance-gateway.git
            cd attendance-gateway
            git config --global --add safe.directory /root/attendance-gateway
          fi
      - run: docker build -t attendance-backend:ci /root/attendance-gateway/backend
      - run: docker build -t attendance-portal:ci /root/attendance-gateway/portal
      - run: docker build -t attendance-admin:ci /root/attendance-gateway/admin

  # ---- CD: on every push to main, build the images AND update the running
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker-build]
    runs-on: [self-hosted, docker]

    steps:
      - name: Checkout code
        run: |
          apk add --no-cache git
          rm -rf /tmp/attendance-gateway
          git clone --depth=1 --branch main \
            http://gitea:3000/het/attendance-gateway.git \
            /tmp/attendance-gateway

      - name: Copy deployment files
        run: |
          set -e

          echo "=== COPYING BACKEND ==="
          cp -r /tmp/attendance-gateway/backend/. \
            /deployment/attendance-backend/

          echo "=== COPYING PORTAL ==="
          cp -r /tmp/attendance-gateway/portal/. \
            /deployment/attendance-portal/portal/

          echo "=== COPYING ADMIN ==="
          cp -r /tmp/attendance-gateway/admin/. \
            /deployment/attendance-admin/admin/

      - name: Deploy backend
        run: |
          set -e
          cd /deployment/attendance-backend
          docker compose up -d --build

      - name: Deploy portal
        run: |
          set -e
          cd /deployment/attendance-portal
          docker compose up -d --build

      - name: Deploy admin
        run: |
          set -e
          cd /deployment/attendance-admin
          docker compose up -d --build

      - name: Verify health
        run: |
          set -e

          echo "=== CONTAINERS ==="
          docker ps --filter name=attendance- \
            --format "{{.Names}} {{.Image}} {{.Status}}"

          echo "=== API ==="
          curl -sf https://api.atmyhome.tech/health
          echo

          echo "=== PORTAL ==="
          curl -sf https://portal.atmyhome.tech/ > /dev/null
          echo "Portal OK"

          echo "=== ADMIN ==="
          curl -sf https://admin.atmyhome.tech/ > /dev/null
          echo "Admin OK"

          echo "=== DEPLOYMENT SUCCESS ==="
